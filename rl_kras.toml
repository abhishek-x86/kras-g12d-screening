run_type = "staged_learning"
device = "cpu"
tb_logdir = "/home/abhi/kras_screening/tb_logs"
json_out_config = "/home/abhi/kras_screening/rl_kras_out.json"

[parameters]
prior_file = "/home/abhi/kras_screening/priors/reinvent.prior"
agent_file = "/home/abhi/kras_screening/priors/reinvent.prior"
summary_csv_prefix = "/home/abhi/kras_screening/results/kras_g12d_rl"
batch_size = 32
randomize_smiles = true

[learning_strategy]
type = "dap"
