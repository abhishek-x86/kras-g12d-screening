run_type = "staged_learning"
device = "cpu"
tb_logdir = "/home/abhi/kras_screening/tb_logs_v2"
json_out_config = "/home/abhi/kras_screening/rl_kras_v2_out.json"

[parameters]
prior_file = "/home/abhi/kras_screening/priors/reinvent.prior"
agent_file = "/home/abhi/kras_screening/priors/reinvent.prior"
summary_csv_prefix = "/home/abhi/kras_screening/results/kras_g12d_rl_v2"
batch_size = 32
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
penalty_multiplier = 0.5

[[stage]]
chkpt_file = "/home/abhi/kras_screening/checkpoints/stage_v2.chkpt"
max_score = 0.85
min_steps = 10
max_steps = 100

[stage.scoring]
type = "geometric_mean"

# 1. Switch-II Pocket Binding Affinity (AutoDock Vina)
[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "Vina_Docking_KRAS_G12D"
weight = 0.55
[stage.scoring.component.ExternalProcess.endpoint.params]
executable = "/home/abhi/kras_screening/kras/bin/python"
args = "/home/abhi/kras_screening/vina_worker.py"
property = "docking_score"

# 2. Route-Agnostic Synthetic Accessibility (rewards easy 3-5 step synthesis, SA <= 3.5)
[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name = "Synthetic_Accessibility"
weight = 0.25
transform.type = "reverse_sigmoid"
transform.high = 4.5
transform.low = 2.0
transform.k = 0.5

# 3. General Drug-Likeness (QED)
[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "Drug_Likeness_QED"
weight = 0.20

# 4. Global Reactive / Unstable Functional Group Filter (blocks beta-keto/anhydrides, peroxides, acyl halides, etc.)
[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Preclinical_Stability_Alerts"
params.smarts = [
    "[*;r8]",
    "[*;r9]",
    "[*;r10]",
    "[#8][#8]",
    "[#6](=[O,S])[O,S][#6](=[O,S])",
    "[#6](=[O])[#6][#6](=[O])",
    "[C,c](=[O])[F,Cl,Br,I]",
    "[N+](=O)[O-]",
    "[#16;!s][#16;!s]",
    "C#C"
]
